<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vamor" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Vamor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ------------------------------------------------------------- boot -->
<div id="splash" class="screen">
  <div class="spinner"></div>
</div>

<!-- ------------------------------------------------------------- auth -->
<div id="auth" class="screen" hidden>
  <div class="login-card">
    <div class="login-mark">💌</div>
    <h1>Voicemail for amor</h1>

    <!-- step 1: ask for the email -->
    <form id="emailForm">
      <p class="sub">Sign in and I'll email you a link.</p>
      <label class="field">
        <span>Your email</span>
        <input id="email" type="email" inputmode="email" autocomplete="email"
               placeholder="you@example.com" required />
      </label>
      <button type="submit" class="btn-primary">Send me the link</button>
    </form>

    <!-- step 2: link sent, offer the code as a fallback -->
    <form id="codeForm" hidden>
      <p class="sub">Check <b id="sentTo"></b> — tap the link in the email.</p>
      <label class="field">
        <span>Or type the 6-digit code from that email</span>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="6" placeholder="123456" />
      </label>
      <button type="submit" class="btn-primary">Sign in</button>
      <button type="button" id="backToEmail" class="btn-link">Use a different email</button>
    </form>

    <p id="authNote" class="note" hidden></p>
    <p id="authError" class="error" hidden></p>
  </div>
</div>

<!-- ----------------------------------------------------------- chat -->
<div id="chat" class="screen" hidden>
  <header class="topbar">
    <div class="avatar" id="peerAvatar">♥</div>
    <div class="peer">
      <div class="peer-name" id="peerName">Waiting for her…</div>
      <div class="peer-status" id="peerStatus">offline</div>
    </div>
    <button id="btnTheme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <button id="btnSignOut" class="icon-btn" title="Sign out" aria-label="Sign out">⏻</button>
  </header>

  <main id="thread" class="thread">
    <div id="empty" class="empty">
      <div class="empty-mark">💌</div>
      <p>No messages yet.<br />Say something sweet, or hold the mic and leave a voice mail.</p>
    </div>
  </main>

  <div id="typing" class="typing-row" hidden>
    <div class="bubble in typing-bubble"><span></span><span></span><span></span></div>
  </div>

  <!-- recording overlay -->
  <div id="recBar" class="rec-bar" hidden>
    <button id="recCancel" class="rec-cancel" title="Cancel">✕</button>
    <span class="rec-dot"></span>
    <span id="recTime" class="rec-time">0:00</span>
    <canvas id="recWave" class="rec-wave" height="36"></canvas>
    <span class="rec-hint">release to send</span>
  </div>

  <footer class="composer">
    <input id="input" type="text" placeholder="Write something…" autocomplete="off" maxlength="4000" />
    <button id="btnSend" class="send-btn" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
    <button id="btnMic" class="mic-btn" title="Hold to record a voice mail" aria-label="Record voice message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V22h-2v-3.07A7 7 0 0 1 5 12a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg>
    </button>
  </footer>
</div>

<!-- reaction picker -->
<div id="reactions" class="reactions" hidden>
  <button data-e="❤️">❤️</button>
  <button data-e="😂">😂</button>
  <button data-e="😍">😍</button>
  <button data-e="🥺">🥺</button>
  <button data-e="👍">👍</button>
  <button data-e="🔥">🔥</button>
  <button data-e="" class="clear">✕</button>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
